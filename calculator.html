<!doctype html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="border">
    <p class="js-display  show"></p>
    <button onclick="clearCalc() " class="btnC">C</button>
    <p>
        <button onclick="updateCalc('1')" class="btn">1</button>
        <button onclick="updateCalc('2')" class="btn">2</button>
        <button onclick="updateCalc('3')" class="btn">3</button>
        <button onclick="updateCalc('+')" class="btnO">+</button>
    </p>

    <p>
        <button onclick="updateCalc('4')" class="btn">4</button>
        <button onclick="updateCalc('5')" class="btn">5</button>
        <button onclick="updateCalc('6')" class="btn">6</button>
        <button onclick="updateCalc('-')" class="btnO">-</button>
    </p>

    <p>
        <button onclick="updateCalc('7')" class="btn">7</button>
        <button onclick="updateCalc('8')" class="btn">8</button>
        <button onclick="updateCalc('9')" class="btn">9</button>
        <button onclick="updateCalc('*')" class="btnO">*</button>
    </p>

    <p>
        <button onclick="updateCalc('0')" class="btn">0</button>
        <button onclick="updateCalc('.')" class="btn">.</button>
        <button onclick="updateCalc('/')" class="btn">/</button>
        <button onclick="calculate()" class="btnO">=</button>
    </p>
</div>


    
    

<script src="./script.js"></script>
  
</script>

</body>
</html>
